# /etc/apache2/sites-available/iot-radar.conf
<VirtualHost *:80>
    ServerName raspberrypi.local
    ServerAdmin webmaster@localhost

    # ONE process: only one sweep thread may drive the servo.
    # Several threads so the page can poll while the sweep runs.
    # www-data must be in the "gpio" group, and own /var/www/iot-radar (lgpio writes files there).
    WSGIDaemonProcess iot-radar user=www-data group=www-data processes=1 threads=5 home=/var/www/iot-radar
    WSGIProcessGroup iot-radar
    WSGIApplicationGroup %{GLOBAL}
    WSGIScriptAlias / /var/www/iot-radar/radar.wsgi

    <Directory /var/www/iot-radar>
        Require all granted
    </Directory>

    # Let Apache serve CSS/JS directly
    Alias /static /var/www/iot-radar/static
    <Directory /var/www/iot-radar/static>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/iot-radar-error.log
    CustomLog ${APACHE_LOG_DIR}/iot-radar-access.log combined
</VirtualHost>
